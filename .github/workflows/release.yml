name: Release provider binary

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish assets to"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            gerbil-asset: gerbil-v0.19-d801e7a1c7f77df421f638e62aaebe370f193c97-linux-x86_64-portable-full-single-host-unlimited-patch8bbb52add2b9
            gerbil-sha256: 44da3780cf450a6b747bf327b837696e0f99d5177a5a8046f9f65cd54e126745
          - os: macos-26
            target: aarch64-apple-darwin
            gerbil-asset: gerbil-v0.19-d801e7a1c7f77df421f638e62aaebe370f193c97-darwin-aarch64-gcc16-arm64-aot-tools-single-host-unlimited-patch16675e99f856
            gerbil-sha256: c6a4bc783311670ea56d0c384ebdffae491112ba9bdd253cd763a260a5793d6b
    env:
      BINARY: asp-gerbil-scheme
      GERBIL_REF: d801e7a1c7f77df421f638e62aaebe370f193c97
      GERBIL_PREFIX: ${{ github.workspace }}/.ci/gerbil/release-v0.19-d801e7a
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Ensure release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "release tag must start with v: $RELEASE_TAG" >&2; exit 2 ;;
          esac
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew unlink gambit-scheme || true
          brew unlink ghostscript || true
          brew install gcc jq openssl pkg-config sqlite zlib
          gcc_prefix="$(brew --prefix gcc)"
          gcc_bin="$(
            find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' \
              | awk -F- '{print $NF "\t" $0}' \
              | sort -n \
              | tail -n 1 \
              | cut -f2-
          )"
          test -x "$gcc_bin"
          echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Download verified Gerbil v0.19 release
        env:
          GERBIL_ASSET: ${{ matrix.gerbil-asset }}
          GERBIL_SHA256: ${{ matrix.gerbil-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$GERBIL_ASSET.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tao3k/gerbil-bazel/releases/download/$GERBIL_ASSET/$GERBIL_ASSET.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$GERBIL_SHA256" "$archive" | sha256sum --check -
          else
            printf '%s  %s\n' "$GERBIL_SHA256" "$archive" | shasum -a 256 --check -
          fi
          mkdir -p "$GERBIL_PREFIX"
          tar -xzf "$archive" -C "$GERBIL_PREFIX" --strip-components=1
          jq -e --arg revision "$GERBIL_REF" \
            '.upstreamRevision == $revision' \
            "$GERBIL_PREFIX/gerbil-toolchain-release.json"
          source "$GERBIL_PREFIX/activate"
          echo "GERBIL_PREFIX=$GERBIL_PREFIX" >> "$GITHUB_ENV"
          echo "GERBIL_HOME=$GERBIL_HOME" >> "$GITHUB_ENV"
          echo "GAMBOPT=$GAMBOPT" >> "$GITHUB_ENV"
          echo "$GERBIL_PREFIX/bin" >> "$GITHUB_PATH"
          gxi --version
          gxpkg version
          gxi -e '(displayln "gerbil-ready")'

      - name: Restore Gerbil package dependency cache
        id: gerbil-pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gerbil/pkg
            .gerbil
          key: gerbil-pkg-v19-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-sha256 }}-${{ hashFiles('gerbil.pkg') }}

      - name: Install Gerbil package dependencies from gerbil.pkg
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gxpkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gxpkg deps --install
          if [ ! -e .gerbil/pkg/asp-gerbil-scheme ]; then
            gxpkg link asp-gerbil-scheme .
          fi
          gxpkg list

      - name: Save Gerbil package dependency cache
        if: steps.gerbil-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gerbil/pkg
            .gerbil
          key: gerbil-pkg-v19-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-sha256 }}-${{ hashFiles('gerbil.pkg') }}

      - name: Build canonical provider binary
        shell: bash
        run: |
          set -euo pipefail
          build_cores() {
            nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2
          }
          GERBIL_BUILD_CORES="$(build_cores)" gxpkg env gxi ./build-provider.ss clean
          GERBIL_BUILD_CORES="$(build_cores)" gxpkg env gxi ./build-provider.ss compile
          test -x .gerbil/bin/asp-gerbil-scheme

      - name: Package provider binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/bin package/src
          cp .gerbil/bin/asp-gerbil-scheme package/bin/asp-gerbil-scheme
          cp -R src/. package/src/
          cp gerbil.pkg package/gerbil.pkg
          chmod +x "package/bin/${BINARY}"
          asset="${BINARY}-${TARGET}.tar.gz"
          tar -czf "$asset" -C package .
          digest="$(openssl dgst -sha256 "$asset" | sed 's/^.*= //')"
          printf '%s  %s\n' "$digest" "$asset" > "${asset}.sha256"

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Provider binary release $RELEASE_TAG" \
            || gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" "${BINARY}-${TARGET}.tar.gz" "${BINARY}-${TARGET}.tar.gz.sha256" --clobber
