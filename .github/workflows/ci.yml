name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native Gerbil ${{ matrix.target }} (${{ matrix.os }}, ${{ matrix.gerbil-label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: library
            gerbil-label: release-v0.19-2591dcd
            gerbil-ref: 2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb
            gerbil-asset: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-linux-x86_64-portable-full-single-host-unlimited-patchf5cedd8168cb
            gerbil-sha256: 9844ba362fdf6f1c5e8a4411e462a466d52dee0d541f8e84f61091cec0e5e740
          - os: macos-latest
            target: library
            gerbil-label: release-v0.19-2591dcd
            gerbil-ref: 2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb
            gerbil-asset: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-darwin-aarch64-gcc16-arm64-aot-tools-single-host-unlimited-patchf5cedd8168cb
            gerbil-sha256: 8d9c88434aed6301eaebb719bf52472f05c2368eafc630e8a9f1d67cc9895a21
          - os: ubuntu-latest
            target: provider
            gerbil-label: release-v0.19-2591dcd
            gerbil-ref: 2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb
            gerbil-asset: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-linux-x86_64-portable-full-single-host-unlimited-patchf5cedd8168cb
            gerbil-sha256: 9844ba362fdf6f1c5e8a4411e462a466d52dee0d541f8e84f61091cec0e5e740
          - os: macos-latest
            target: provider
            gerbil-label: release-v0.19-2591dcd
            gerbil-ref: 2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb
            gerbil-asset: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-darwin-aarch64-gcc16-arm64-aot-tools-single-host-unlimited-patchf5cedd8168cb
            gerbil-sha256: 8d9c88434aed6301eaebb719bf52472f05c2368eafc630e8a9f1d67cc9895a21
    env:
      GERBIL_REF: ${{ matrix.gerbil-ref }}
      GERBIL_PREFIX: ${{ github.workspace }}/.ci/gerbil/${{ matrix.gerbil-label }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Restore Homebrew cache
        if: runner.os == 'macOS'
        id: homebrew-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ runner.arch }}-gerbil-source-deps-v3
          restore-keys: |
            homebrew-${{ runner.os }}-${{ runner.arch }}-gerbil-source-deps-

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew unlink gambit-scheme || true
          brew unlink ghostscript || true
          brew install gcc jq openssl pkg-config sqlite zlib

      - name: Select macOS Gerbil compiler
        if: runner.os == 'macOS'
        run: |
          gcc_prefix="$(brew --prefix gcc)"
          gcc_bin="$(
            find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' \
              | awk -F- '{print $NF "\t" $0}' \
              | sort -n \
              | tail -n 1 \
              | cut -f2-
          )"
          test -n "$gcc_bin"
          test -x "$gcc_bin"
          echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          "$gcc_bin" --version

      - name: Save Homebrew cache
        if: runner.os == 'macOS' && steps.homebrew-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ runner.arch }}-gerbil-source-deps-v3

      - name: Download verified Gerbil v0.19 release
        env:
          GERBIL_ASSET: ${{ matrix.gerbil-asset }}
          GERBIL_SHA256: ${{ matrix.gerbil-sha256 }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(uname -m)" = arm64
          fi
          archive="$RUNNER_TEMP/$GERBIL_ASSET.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tao3k/gerbil-bazel/releases/download/$GERBIL_ASSET/$GERBIL_ASSET.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$GERBIL_SHA256" "$archive" | sha256sum --check -
          else
            printf '%s  %s\n' "$GERBIL_SHA256" "$archive" | shasum -a 256 --check -
          fi
          mkdir -p "$GERBIL_PREFIX"
          tar -xzf "$archive" -C "$GERBIL_PREFIX" --strip-components=1
          jq -e --arg revision "$GERBIL_REF" \
            '.upstreamRevision == $revision' \
            "$GERBIL_PREFIX/gerbil-toolchain-release.json"
          source "$GERBIL_PREFIX/activate"
          echo "GERBIL_PREFIX=$GERBIL_PREFIX" >> "$GITHUB_ENV"
          echo "GERBIL_HOME=$GERBIL_HOME" >> "$GITHUB_ENV"
          echo "GAMBOPT=$GAMBOPT" >> "$GITHUB_ENV"
          echo "$GERBIL_PREFIX/bin" >> "$GITHUB_PATH"
          gerbil --version
          gerbil pkg version
          gerbil interactive -e '(displayln "gerbil-ready")'
          gerbil pkg list

      - name: Restore Gerbil package dependency cache
        id: gerbil-pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-pkg-asp-gerbil-scheme-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-sha256 }}-${{ hashFiles('gerbil.pkg') }}

      - name: Install Gerbil package dependencies from gerbil.pkg
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          package_cache_ready=false
          if [ -d .gerbil/lib ]; then
            if gerbil env gerbil interactive -e '(begin (import :clan/base :clan/poo/object) (displayln "gerbil-package-cache-ready"))'; then
              package_cache_ready=true
            else
              echo "Cached Gerbil packages are missing compiled dependency libraries; rebuilding"
            fi
          fi
          if [ "$package_cache_ready" = "true" ]; then
            echo "Using cached Gerbil package dependency build products"
          else
            gerbil deps --install
          fi
          if [ ! -e .gerbil/pkg/asp-gerbil-scheme ]; then
            gerbil pkg link asp-gerbil-scheme .
          fi
          gerbil clean
          gerbil pkg list

      - name: Save Gerbil package dependency cache
        if: steps.gerbil-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-pkg-asp-gerbil-scheme-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-sha256 }}-${{ hashFiles('gerbil.pkg') }}

      - name: Build canonical library target
        if: matrix.target == 'library'
        timeout-minutes: 10
        run: |
          gerbil clean
          gerbil build

      - name: Build canonical provider target
        if: matrix.target == 'provider'
        timeout-minutes: 10
        run: |
          gerbil env gerbil interactive ./build-provider.ss clean
          gerbil env gerbil interactive ./build-provider.ss compile
          test -x .gerbil/bin/asp-gerbil-scheme

      - name: Run canonical semantic library tests
        if: matrix.target == 'library'
        run: |
          gerbil test \
            t/build-script-command-test.ss \
            t/build-api-startup-scenario-test.ss \
            t/package-build-contract-test.ss \
            t/package-native-declaration-test.ss \
            t/build-api-source-bootstrap-test.ss \
            t/provider-owned-schema-registry-test.ss \
            t/exact-source-projection-test.ss \
            t/projection-batch-test.ss \
            t/projection-batch-scenario-test.ss \
            t/language-projection-test.ss \
            t/testing-extension-test.ss \
            t/testing-native-batch-scenario-test.ss \
            t/project-policy-test.ss

      - name: Run package policy boundary regressions
        if: matrix.target == 'library'
        timeout-minutes: 20
        run: |
          gerbil test \
            t/policy/macro-governance-framework-test.ss \
            t/policy/modularity-test.ss \
            t/policy/agent-basic-core-test.ss \
            t/policy/agent-style-comment-doc-test.ss \
            t/unit/parser/parser-test-part1.ss \
            t/unit/parser/parser-test-part7.ss \
            t/unit/parser/parser-test-part8-package-scope.ss

      - name: Run canonical provider tests
        if: matrix.target == 'provider'
        run: |
          # The provider artifact is already complete. The library build below
          # supplies only the Gerbil-side test client and shared semantic test
          # modules; it does not participate in producing the executable.
          gerbil build
          gerbil test \
            t/provider-package-spec-test.ss
          # The HTTP suite owns a sub-millisecond service gate. Run it at full
          # machine performance without unrelated test processes competing for
          # its samples; do not lower native build/test capacity.
          gerbil test t/provider-http-json-server-test.ss
